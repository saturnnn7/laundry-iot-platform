name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        working-directory: src/backend
        run: dotnet build -c Release

      - name: Test
        working-directory: src/backend
        run: dotnet test -c Release

      - name: License check
        run: pwsh ./tools/check-licenses.ps1

  module-template:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/backend/global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        working-directory: src/backend
        run: dotnet tool restore

      - name: Create a module with the script
        run: pwsh ./tools/new-module.ps1 -Name CiProbe

      - name: Build
        working-directory: src/backend
        run: dotnet build Laundry.Backend.slnx -c Release

      - name: Architecture tests
        working-directory: src/backend
        run: dotnet test --project tests/Laundry.Tests.Architecture -c Release

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t laundry-backend:ci src/backend

      - name: Start container
        run: |
          signing_key="$(openssl rand -base64 48)"
          docker run -d --name laundry-ci -p 8080:8080 \
            -e "Jwt__SigningKey=${signing_key}" \
            -e "ConnectionStrings__Default=Host=localhost;Database=ci" \
            laundry-backend:ci

      - name: Wait for liveness
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/live || true)"
            if [ "$code" = "200" ]; then
              echo "Liveness returned 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Liveness did not return 200 within 30 seconds"
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs laundry-ci

      - name: Stop container
        if: always()
        run: docker rm -f laundry-ci
